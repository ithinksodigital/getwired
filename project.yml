name: Wired
options:
  bundleIdPrefix: xyz.getwired
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
  fileTypes:
    icon:
      file: true
      buildPhase: resources

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
  configs:
    Release:
      ARCHS: arm64 x86_64
      ONLY_ACTIVE_ARCH: NO

configs:
  Debug: debug
  Release: release

targets:
  Wired:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - path: Sources/Wired
      # wired.icon must be attached as resources (XcodeGen often skips standalone `resources:` for app targets)
      - path: wired.icon
        buildPhase: resources
      - path: Resources/Info.plist
        buildPhase: none
        type: file
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: xyz.getwired.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        INFOPLIST_PREPROCESS: NO
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: wired
    scheme: {}
    info:
      path: Resources/Info.plist
      properties:
        LSUIElement: true
        NSHighResolutionCapable: true
        CFBundleIconName: wired
        NSHumanReadableCopyright: "Copyright © 2026 · wired.withbyte.co"
